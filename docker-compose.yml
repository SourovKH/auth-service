version: "3"
services:
  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "6831:6831/udp"   # Jaeger UDP protocol for tracing
      - "6832:6832/udp"   # Jaeger UDP protocol for tracing
      - "5778:5778"       # Jaeger HTTP for configuration
      - "16686:16686"     # Jaeger UI
      - "4317:4317"       # gRPC protocol for OpenTelemetry
      - "4318:4318"       # HTTP protocol for OpenTelemetry
      - "14250:14250"     # Jaeger gRPC endpoint
      - "14268:14268"     # Jaeger HTTP endpoint
      - "14269:14269"     # Jaeger admin endpoint
      - "9411:9411"       # Zipkin compatible endpoint

    restart: unless-stopped
